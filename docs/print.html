<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ใบขออนุญาตปฏิบัติงาน</title>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 10mm; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b2a1a; font-family: 'Sarabun', sans-serif; font-size: 11.5px; color: #111; }
  .bar { position: sticky; top: 0; display: flex; gap: 10px; justify-content: center; padding: 12px; background: #04170e; z-index: 5; }
  .bar button, .bar a { font: 600 14px 'Sarabun'; padding: 9px 18px; border-radius: 10px; border: 0; cursor: pointer; background: linear-gradient(135deg, #059669, #a3e635); color: #00220f; text-decoration: none; }
  .bar a { background: #1e3a2c; color: #d1fae5; }
  .page { width: 210mm; min-height: 297mm; margin: 16px auto; background: #fff; padding: 10mm; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .page + .page { page-break-before: always; }
  table { width: 100%; border-collapse: collapse; }
  td, th { border: 1px solid #333; padding: 4px 6px; vertical-align: top; }
  .head td { vertical-align: middle; }
  .title { text-align: center; font-size: 17px; font-weight: 700; line-height: 1.25; }
  .co { font-weight: 600; font-size: 12.5px; }
  .sec { background: #0f5132; color: #fff; font-weight: 700; padding: 4px 8px; }
  .sub { background: #d1fae5; font-weight: 700; }
  .cb { display: inline-block; width: 12px; height: 12px; border: 1px solid #222; vertical-align: -2px; text-align: center; line-height: 10px; font-size: 11px; font-weight: 700; }
  .cb.on { background: #0f5132; color: #fff; border-color: #0f5132; }
  .it { margin: 1px 0; line-height: 1.45; }
  .grp { font-weight: 600; margin-top: 3px; }
  .ppe { display: flex; flex-wrap: wrap; gap: 2px 14px; padding-left: 12px; margin-bottom: 2px; }
  u.fill { text-decoration: none; border-bottom: 1px dotted #555; padding: 0 4px; min-width: 60px; display: inline-block; color: #0b2a6b; }
  .val { color: #0b2a6b; font-weight: 600; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .cols > div { padding: 4px 6px; }
  .cols > div:first-child { border-right: 1px solid #333; }
  .wt-off { opacity: .45; }
  .sig { height: 42px; max-width: 150px; object-fit: contain; display: block; margin: 0 auto; }
  .center { text-align: center; }
  .small { font-size: 10.5px; }
  .stamp { position: absolute; top: 40mm; right: 18mm; transform: rotate(-14deg); border: 3px solid; border-radius: 10px; padding: 6px 16px; font-size: 22px; font-weight: 700; opacity: .8; }
  .stamp.approved, .stamp.closed { color: #047857; } .stamp.pending { color: #b45309; } .stamp.rejected { color: #b91c1c; } .stamp.expired { color: #64748b; }
  .no { font-weight: 700; font-size: 13px; color: #0f5132; }
  ol { margin: 4px 0; padding-left: 18px; } li { margin-bottom: 3px; line-height: 1.5; }
  @media print { body { background: #fff; } .bar { display: none; } .page { margin: 0; box-shadow: none; width: auto; min-height: auto; padding: 0; } }
</style></head><body>
<div class="bar"><button onclick="print()">🖨️ พิมพ์ / บันทึก PDF</button><a href="javascript:history.back()">← กลับ</a></div>
<div id="print-root"><div class="page" style="min-height:auto;text-align:center;font-size:16px">กำลังโหลดข้อมูล...</div></div>
<script src="config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js?v=4"></script>
<script src="assets/js/parts.js?v=4"></script>
<script src="assets/js/pages/print.js?v=3"></script>
</body></html>
